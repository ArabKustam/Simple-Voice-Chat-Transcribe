# SVC-Transcribe messages (English). Colors: &0-&f, &#RRGGBB. Placeholders in {braces}.
prefix: "&8[&bSVC-Transcribe&8] &r"
no-permission: "&cYou don't have permission to do that."
player-only: "&cOnly players can use this command."
reloaded: "&aConfiguration reloaded."
subtitles-hidden: "&7Speech bubbles are now hidden for you. Show them again with &f/svct toggle"
subtitles-shown: "&aSpeech bubbles are visible again."
player-not-found: "&cPlayer {player} not found."
world-not-found: "&cWorld {world} not found."
player-transcription-on: "&aTranscription enabled for {player}."
player-transcription-off: "&eTranscription disabled for {player}."
world-transcription-on: "&aTranscription enabled in world {world}."
world-transcription-off: "&eTranscription disabled in world {world}."
engine-changed: "&aSpeech engine: &f{engine}&a. It loads in the background, check &f/svct status"
engine-unknown: "&cUnknown engine {engine}. List: /svct engine"
language-changed: "&aRecognition language: &f{language}"
help:
  - "&b/svct toggle &7- hide/show speech bubbles for yourself"
  - "&b/svct status &7- engine state and load"
  - "&b/svct reload &7- reload the configuration"
  - "&b/svct engine <auto|vosk|t-one|deepgram|openai> &7- switch the speech engine"
  - "&b/svct language <en|ru|...|auto> &7- recognition language"
  - "&b/svct player <name> <on|off> &7- transcription of a player"
  - "&b/svct world <world> <on|off> &7- transcription in a world"
