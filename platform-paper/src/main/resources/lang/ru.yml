# Сообщения SVC-Transcribe (русский). Цвета: &0-&f, &#RRGGBB. Подстановки в {скобках}.
prefix: "&8[&bSVC-Transcribe&8] &r"
no-permission: "&cНедостаточно прав."
player-only: "&cКоманда только для игроков."
reloaded: "&aКонфиг перезагружен."
subtitles-hidden: "&7Облачки скрыты. Вернуть: &f/svct toggle"
subtitles-shown: "&aОблачки снова видны."
player-not-found: "&cИгрок {player} не найден."
world-not-found: "&cМир {world} не найден."
player-transcription-on: "&aТранскрибация для {player} включена."
player-transcription-off: "&eТранскрибация для {player} выключена."
world-transcription-on: "&aТранскрибация в мире {world} включена."
world-transcription-off: "&eТранскрибация в мире {world} выключена."
engine-changed: "&aДвижок распознавания: &f{engine}&a. Загрузка идет в фоне, состояние: &f/svct status"
engine-unknown: "&cНеизвестный движок {engine}. Список: /svct engine"
language-changed: "&aЯзык распознавания: &f{language}"
config-usage: "&7Использование: &f/svct set <параметр> <значение>&7, список параметров: &f/svct get [раздел]"
config-unknown: "&cНеизвестный параметр {option}. Список: /svct get"
config-bad-value: "&cЗначение {value} не подходит для {option}."
config-set: "&a{option} = &f{value}&a (сохранено в config.yml и применено)"
help:
  - "&b/svct toggle &7- скрыть/показать облачки для себя"
  - "&b/svct status &7- состояние движка и нагрузки"
  - "&b/svct reload &7- перезагрузить конфиг"
  - "&b/svct get [раздел] &7- показать настройки"
  - "&b/svct set <параметр> <значение> &7- изменить любую настройку (Tab подсказывает)"
  - "&b/svct engine <auto|vosk|t-one|deepgram|openai> &7- движок распознавания"
  - "&b/svct language <ru|en|...|auto> &7- язык распознавания"
  - "&b/svct player <ник> <on|off> &7- транскрибация игрока"
  - "&b/svct world <мир> <on|off> &7- транскрибация в мире"
