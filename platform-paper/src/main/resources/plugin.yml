name: SVC-Transcribe
version: '${version}'
main: org.lavacast.svctranscribe.paper.SVCTranscribePlugin
api-version: '1.20'
description: Real-time speech-to-text for Simple Voice Chat with speech bubbles above players and an API for other plugins.
authors: [lavacast]
softdepend: [voicechat]
# Downloaded by Paper/Spigot from Maven Central on first start (includes native libraries for Windows, Linux x64, macOS).
libraries:
  - com.alphacephei:vosk:${voskVersion}
  - com.microsoft.onnxruntime:onnxruntime:${onnxRuntimeVersion}

commands:
  vtt:
    description: SVC-Transcribe commands (voice to text)
    usage: /vtt help
    aliases: [voicetotext]

permissions:
  svctranscribe.see:
    description: See speech bubbles above speaking players
    default: true
  svctranscribe.transcribe:
    description: Own speech is transcribed (bubbles and API events)
    default: true
  svctranscribe.command.toggle:
    description: Hide or show speech bubbles for yourself with /vtt toggle
    default: true
  svctranscribe.admin:
    description: All admin commands
    default: op
    children:
      svctranscribe.admin.reload: true
      svctranscribe.admin.status: true
      svctranscribe.admin.player: true
      svctranscribe.admin.world: true
      svctranscribe.admin.engine: true
      svctranscribe.admin.config: true
      svctranscribe.admin.demo: true
  svctranscribe.admin.reload:
    description: Reload the config (/vtt reload)
    default: op
  svctranscribe.admin.status:
    description: Show engine and load status (/vtt status)
    default: op
  svctranscribe.admin.player:
    description: Enable or disable transcription for a player (/vtt player)
    default: op
  svctranscribe.admin.world:
    description: Enable or disable transcription in a world (/vtt world)
    default: op
  svctranscribe.admin.engine:
    description: Switch the speech engine and language (/vtt engine, /vtt language)
    default: op
  svctranscribe.admin.config:
    description: View and change any config option (/vtt get, /vtt set)
    default: op
  svctranscribe.admin.demo:
    description: Show a demo speech bubble without a microphone (/vtt demo)
    default: op
