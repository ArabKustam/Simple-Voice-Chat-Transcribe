name: SVC-Transcribe
version: '${version}'
main: org.lavacast.svctranscribe.paper.SVCTranscribePlugin
api-version: '1.20'
description: Real-time speech-to-text for Simple Voice Chat with speech bubbles above players and an API for other plugins.
authors: [lavacast]
softdepend: [voicechat]
# Downloaded by Paper/Spigot from Maven Central on first start (includes native libraries for Windows, Linux x64, macOS).
libraries:
  - com.alphacephei:vosk:${voskVersion}
  - com.microsoft.onnxruntime:onnxruntime:${onnxRuntimeVersion}

commands:
  svctranscribe:
    description: SVC-Transcribe commands
    usage: /svctranscribe help
    aliases: [svct, transcribe]

permissions:
  svctranscribe.see:
    description: See subtitles above speaking players
    default: true
  svctranscribe.transcribe:
    description: Own speech is transcribed (subtitles and API events)
    default: true
  svctranscribe.command.toggle:
    description: Hide or show subtitles for yourself with /svct toggle
    default: true
  svctranscribe.admin:
    description: All admin commands
    default: op
    children:
      svctranscribe.admin.reload: true
      svctranscribe.admin.status: true
      svctranscribe.admin.player: true
      svctranscribe.admin.world: true
      svctranscribe.admin.engine: true
  svctranscribe.admin.engine:
    description: Switch the speech engine and language (/svct engine, /svct language)
    default: op
  svctranscribe.admin.reload:
    description: Reload the config (/svct reload)
    default: op
  svctranscribe.admin.status:
    description: Show engine and load status (/svct status)
    default: op
  svctranscribe.admin.player:
    description: Enable or disable transcription for a player (/svct player)
    default: op
  svctranscribe.admin.world:
    description: Enable or disable transcription in a world (/svct world)
    default: op
